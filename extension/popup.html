<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Local Browser MCP</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main><div class="mark">L</div><div><h1>Local Browser MCP</h1><p id="status">Checking local bridge…</p></div></main>
    <section>
      <span>Control channel</span><strong>127.0.0.1 only</strong>
      <span>Extension port</span><code id="port">…</code>
      <span>Profile</span><code id="profile">…</code>
      <span>Version</span><code id="version">…</code>
    </section>
    <p id="fatal" class="note" hidden></p>
    <button id="reconnect" type="button" hidden>Reconnect</button>
    <p id="route-note" class="note">No hosted relay, account, UUID, token, or remote-control mode exists in this build.</p>
    <script src="popup.js"></script>
  </body>
</html>
